name: 投稿开机动画
description: 拖文件进来就行；大于 25 MB 的走 Releases 直链，其余交给机器人
title: "[投稿] "
labels:
  - submission
body:
  - type: markdown
    attributes:
      value: |
        ### 两种方式，按文件大小选一种

        **① 视频 ≤ 25 MB** —— 直接把文件拖进下面的「视频」框。GitHub 会自己上传它、
        自动把链接填好。**sha256、字节数、分辨率、时长机器人都会自己算**，你一个数字都不用填。

        **② 视频 > 25 MB（4K 原画等）** —— GitHub 的 Issue 附件上限就是 25 MB，拖进来会直接
        上传失败。这种情况先把视频传到你**自己仓库的 Releases**，再把直链粘进「视频」框：

        1. 打开你自己的某个仓库 → 右侧 **Releases** → *Draft a new release*
        2. Tag 随便填（比如 `v1`），把 mp4 拖进附件区等它传完（单个文件最大 **2 GB**，免费）
        3. 传完后复制那个文件的链接，形如
           `https://github.com/<你>/<仓库>/releases/download/v1/xxx.mp4`，粘到下面「视频」框里

        没有自己的仓库也可以：任何**稳定的 https 直链**都行（对象存储、你自己的 CDN）。
        但**网盘分享页不行** —— 机器人要能直接下载到文件本体，它不会去解析网页。

        > 💡 **建议：4K 原画之外再单独投一版 1440p（约 10 MB）**。
        > 大文件下载慢（客户端虽然会自动断点续传），而多数人只想要一个几秒钟就能装好的片头。
        > 一版原画给追求画质的人，一版 1440p 给大多数人 —— 两条投稿互不影响。

  - type: textarea
    id: video
    attributes:
      label: 视频
      description: ≤ 25 MB 就把 mp4 拖进这个框；更大的请传到自己仓库的 Releases，再把直链粘进来
      placeholder: 把视频文件拖到这里…（或粘贴 https 直链）
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: 名称
      description: 留空就用文件名。≤ 32 字
      placeholder: 赛博霓虹

  - type: input
    id: tags
    attributes:
      label: 标签
      description: 逗号分隔，用于筛选。留空也行
      placeholder: 赛博朋克, 深色, 蓝色

  - type: dropdown
    id: license
    attributes:
      label: 授权方式
      options:
        - CC-BY-4.0
        - CC0-1.0
        - 自创，允许自由转载
        - 其他（请在下面说明）
    validations:
      required: true

  - type: dropdown
    id: nsfw
    attributes:
      label: 是否含不适宜内容
      description: 客户端默认隐藏标记为「是」的条目
      options:
        - "否"
        - "是"
    validations:
      required: true

  - type: checkboxes
    id: declare
    attributes:
      label: 声明
      options:
        - label: 我确认我拥有该视频的权利或已获得授权，且内容不含违法、色情、暴力或仇恨内容
          required: true
        - label: 我理解本目录采取「自助投稿 + 事后下架」，如果被举报并核实，条目会被删除
          required: true
