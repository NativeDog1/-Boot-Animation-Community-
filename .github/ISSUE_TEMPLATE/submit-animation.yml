name: 投稿开机动画
description: 把视频拖进来就行；太大就贴个链接，机器人会替你托管
title: "[投稿] "
labels:
  - submission
body:
  - type: markdown
    attributes:
      value: |
        ### 把视频拖进下面的「视频」框就行 —— 大小都不用你操心

        - **≤ 10 MB**：直接把文件拖进去。GitHub 会自己上传它、自动填好链接。
        - **> 10 MB（4K 原画等）**：GitHub 的表单装不下这么大的附件，那就**贴一个能直接下载的
          https 链接**。临时的也行（网盘临时直链、你自己的 Releases、任何直链都算）——
          机器人会**立刻把视频搬进社区仓库长期托管**，你那个链接只要在它下载的几分钟里有效就够了。

        **不需要你有 GitHub 仓库，也不需要建 Release。** 文件名、sha256、分辨率、时长、
        预览图，全部由机器人自己算，你一个数字都不用填。

        > 💡 手头既没有直链、文件又超过 10 MB？最省事的办法是**压一版 1440p（约 10 MB）直接拖进来**
        > —— 那也正是多数人真正会下载的版本。4K 原画可以之后再补一条。

  - type: textarea
    id: video
    attributes:
      label: 视频
      description: ≤ 10 MB 直接把 mp4 拖进这个框；超过 10 MB 就贴一个能直接下载的 https 链接（临时链接也行）
      placeholder: 把视频文件拖到这里…（或粘贴 https 直链）
    validations:
      required: true

  - type: input
    id: parts
    attributes:
      label: 分片信息
      description: 用投稿向导切分片时会自动填好。手拖多个分片时**必须**有它 —— 机器人靠它知道该拼几片、拼完应该是什么哈希
      placeholder: ba-parts:v1;name=xxx.mp4;bytes=…;parts=…;partbytes=…;sha256=…

  - type: input
    id: name
    attributes:
      label: 名称
      description: 留空就用文件名。≤ 32 字
      placeholder: 赛博霓虹

  - type: input
    id: tags
    attributes:
      label: 标签
      description: 逗号分隔，用于筛选。留空也行
      placeholder: 赛博朋克, 深色, 蓝色

  - type: dropdown
    id: license
    attributes:
      label: 授权方式
      options:
        - CC-BY-4.0
        - CC0-1.0
        - 自创，允许自由转载
        - 其他（请在下面说明）
    validations:
      required: true

  - type: dropdown
    id: nsfw
    attributes:
      label: 是否含不适宜内容
      description: 客户端默认隐藏标记为「是」的条目
      options:
        - "否"
        - "是"
    validations:
      required: true

  - type: checkboxes
    id: declare
    attributes:
      label: 声明
      options:
        - label: 我确认我拥有该视频的权利或已获得授权，且内容不含违法、色情、暴力或仇恨内容
          required: true
        - label: 我理解本目录采取「自助投稿 + 事后下架」，如果被举报并核实，条目会被删除；上架后视频由社区仓库托管
          required: true
