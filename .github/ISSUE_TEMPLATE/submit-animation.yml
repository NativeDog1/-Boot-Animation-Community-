name: 投稿开机动画
description: 把视频拖进来就行，其余交给机器人
title: "[投稿] "
labels:
  - submission
body:
  - type: markdown
    attributes:
      value: |
        ### 你只需要做一件事：把视频文件拖进下面的「视频」框

        拖进去之后 GitHub 会自己上传它、自动把链接填好。**sha256、字节数、分辨率、时长，机器人会自己算** —— 你一个数字都不用填。

        也可以贴一个 https 直链（例如你自己仓库 Releases 里的地址）。投稿规范见 [README](https://github.com/NativeDog1/-Boot-Animation-Community-/blob/main/README.md)。

  - type: textarea
    id: video
    attributes:
      label: 视频
      description: 把 mp4 拖进这个框（推荐），或粘贴 https 直链
      placeholder: 把视频文件拖到这里…
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: 名称
      description: 留空就用文件名。≤ 32 字
      placeholder: 赛博霓虹

  - type: input
    id: tags
    attributes:
      label: 标签
      description: 逗号分隔，用于筛选。留空也行
      placeholder: 赛博朋克, 深色, 蓝色

  - type: dropdown
    id: license
    attributes:
      label: 授权方式
      options:
        - CC-BY-4.0
        - CC0-1.0
        - 自创，允许自由转载
        - 其他（请在下面说明）
    validations:
      required: true

  - type: dropdown
    id: nsfw
    attributes:
      label: 是否含不适宜内容
      description: 客户端默认隐藏标记为「是」的条目
      options:
        - "否"
        - "是"
    validations:
      required: true

  - type: checkboxes
    id: declare
    attributes:
      label: 声明
      options:
        - label: 我确认我拥有该视频的权利或已获得授权，且内容不含违法、色情、暴力或仇恨内容
          required: true
        - label: 我理解本目录采取「自助投稿 + 事后下架」，如果被举报并核实，条目会被删除
          required: true
